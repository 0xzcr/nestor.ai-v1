version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant-anatomy-rag
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
    networks:
      - anatomy-rag

  redis:
    image: redis:alpine
    container_name: redis-anatomy-rag
    ports:
      - "6379:6379"
    volumes:
      - redis_storage:/data
    command: redis-server --appendonly yes
    networks:
      - anatomy-rag

volumes:
  qdrant_storage:
  redis_storage:

networks:
  anatomy-rag:
    driver: bridge
